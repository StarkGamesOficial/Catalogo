<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARK GAMES - Catálogo de Contas Lords Mobile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161a22;
      --accent-gold: #ffb703;
      --accent-orange: #fb8500;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --sold-red: #ef4444;
      --border-color: #262c36;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(180deg, #1f2633 0%, #0d0f12 100%);
      padding: 30px 20px;
      text-align: center;
      border-bottom: 2px solid var(--accent-gold);
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 15px 12px 40px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .filter-box {
      display: flex;
      gap: 10px;
    }

    .filter-box select {
      padding: 12px 15px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      cursor: pointer;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .account-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .account-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-gold);
    }

    .account-card.sold {
      opacity: 0.75;
      border-color: #3f1d24;
    }

    .sold-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: var(--sold-red);
      color: #fff;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .card-header {
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.02);
    }

    .card-ref {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .card-body {
      padding: 15px;
      flex: 1;
    }

    .card-title {
      font-size: 0.95rem;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .details-list {
      list-style: none;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .details-list li {
      margin-bottom: 5px;
    }

    .card-footer {
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--border-color);
    }

    .price-tag {
      font-size: 1.25rem;
      font-weight: bold;
      color: #10b981;
      margin-bottom: 4px;
    }

    .entry-tag {
      font-size: 0.85rem;
      color: var(--accent-orange);
      margin-bottom: 12px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-drive {
      background-color: #2563eb;
      color: #fff;
    }

    .btn-buy {
      background-color: #22c55e;
      color: #fff;
    }

    .btn-disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>

    function formatCurrency(val) {
      return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function renderCatalog(items) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = `account-card ${item.sold ? 'sold' : ''}`;

        let detailsHtml = item.details.map(d => `<li>🔳 ${d}</li>`).join('');

        card.innerHTML = `
          ${item.sold ? '<div class="sold-badge">Vendida</div>' : ''}
          <div class="card-header">
            <div class="card-ref">${item.ref}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <ul class="details-list">
              ${detailsHtml}
            </ul>
          </div>
          <div class="card-footer">
            <div class="price-tag">${formatCurrency(item.price)}</div>
            <div class="entry-tag">Entrada: ${formatCurrency(item.entry)}</div>
            <div class="btn-group">
              <a href="${item.drive}" target="_blank" class="btn btn-drive"><i class="fa-solid fa-folder-open"></i> Fotos</a>
              ${item.sold 
                ? '<button class="btn btn-disabled" disabled>Indisponível</button>'
                : `<a href="https://wa.me/5555999999999?text=Ol%C3%A1,%20tenho%20interesse%20na%20\${encodeURIComponent(item.ref)}" target="_blank" class="btn btn-buy"><i class="fa-brands fa-whatsapp"></i> Comprar</a>`
              }
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCatalog() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      const filtered = catalogData.filter(item => {
        const matchesSearch = item.ref.toLowerCase().includes(search) || 
                              item.title.toLowerCase().includes(search) ||
                              item.details.some(d => d.toLowerCase().includes(search));
        
        let matchesStatus = true;
        if (status === 'available') matchesStatus = !item.sold;
        if (status === 'sold') matchesStatus = item.sold;

        return matchesSearch && matchesStatus;
      });

      renderCatalog(filtered);
    }

    // Inicialização
    filterCatalog();
